<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天气查询</title>
<style>

html,body{
margin: 0px;
overflow-x: hidden;
}
  
#bajing{
width: 100vw;
min-height: 100vh;
background: linear-gradient(to bottom,
#ffd1dc, #e6d6ff, #ceb1ff);
position: fixed;
background-attachment: fixed;
overflow-x: hidden;
z-index: -1;
}

.kiop{
background-color: rgba(255,255,255,0.5);
display: flex;
flex-direction: column;
width: 90%;
height: auto;
margin: auto;
padding:15px 10px 30px 10px;
box-shadow: 5px 8px 5px rgba(0, 0, 0, 0.15);
border-radius: 10px;
border: 1px solid rgba(255, 255, 255, 0.7);
backdrop-filter: blur(15px);
margin-top: 20px;
}

#pssea{
display: flex;
justify-content: center;
}

.ppsme{
font-size: 14px;
color: rgba(80,60,120,0.8);
}

#formew{
display: flex;
}

.ppou{
display: flex;
flex-direction: column;
align-items: center;
}

#dume{
margin-bottom: 0px;
font-size: 28px;
}

#fanoc{
margin-top: 2px;
margin-bottom: 0px;
padding-left: 13px;
font-size: 50px;
}

.xioziqi{
font-size: 15px;
color:rgba(0, 0, 0, 0.5);
margin: 0px;
}

.tian7{
white-space: pre-wrap;
font-size: 15px;
color:rgba(0, 0, 0, 0.5);
}

#tiantxtal{
display: flex;
gap: 15px;
position: relative;
left: 13px;
}


#linka1{
margin: 0px; 
font-size: 10px;
color: #000000;
text-decoration: none;
}


</style>
</head>
<body>

  
<!--背景-->  
<div id="bajing">
</div>


<div class="kiop">

<div>
<span style="margin-top: 0px;font-size: 20px">天气查询</span>
<a id="linka1" href="https://open-meteo.com/">由"Open-Meteo"API获取天气</a>
</div>

<div id="formew">
<input id="cadifan" placeholder="输入你的居住城市">
<button id="caxing">查询</button>
</div>

<p id="jidou"></p>


<div class="ppou">
<h3 id="dume"></h3>
<h1 id="fanoc"></h1>
<p class="xioziqi"></p>
<p class="xioziqi"></p>

<div id="tiantxtal">  
<p class="tian7"></p>
<p class="tian7"></p>
<p class="tian7"></p>
<p class="tian7"></p>
</div>

</div>




</div>

  
<div id="pssea">
<p class="ppsme">
←返回首页
</p>
</div>

  
  
<script>
let suru = document.getElementById("cadifan")
let butt = document.getElementById("caxing")
let out = document.getElementById("jidou")
let dume = document.getElementById("dume")
let fanoc = document.getElementById("fanoc")
let tian7 = document.getElementsByClassName("tian7")[0]
let tian7b = document.getElementsByClassName("tian7")[1]
let tian7c = document.getElementsByClassName("tian7")[2]
let tian7d = document.getElementsByClassName("tian7")[3]
let xioziqi = document.getElementsByClassName("xioziqi")[0]
let xioziqi2 = document.getElementsByClassName("xioziqi")[1]
let ppsme =document.getElementsByClassName("ppsme")[0]
  
let ji = null
let wu = null
let tian7ma = null
let jisi = null
let txtdian = "."

const tianqiDaima = {
0: "晴", 1: "大部晴朗", 2: "多云", 3: "阴",
45: "有雾", 48: "雾凇",
51: "小毛毛雨", 53: "中毛毛雨", 55: "大毛毛雨",
56: "小冻毛毛雨", 57: "大冻毛毛雨",
61: "小雨", 63: "中雨", 65: "大雨",
66: "小冻雨", 67: "大冻雨",
71: "小雪", 73: "中雪", 75: "大雪",
77: "米雪",
80: "小阵雨", 81: "中阵雨", 82: "大阵雨",
85: "小阵雪", 86: "大阵雪",
95: "雷暴", 96: "雷暴小冰雹", 99: "雷暴大冰雹"
}

function jisetxt() {
jisi = setInterval(function () {
if (txtdian >= "....") {
txtdian = "."
} else {
txtdian = txtdian + ".";
}
out.innerText = "正在查询中" + txtdian;

},500)
}

suru.onkeydown = function (e) {
  if (e.key === "Enter") {
    e.preventDefault(); 
    butt.click();     
  }
}


function culi01() {
jisetxt();
let culitext = suru.value.trim()

let formtxt = suru.value.trim();
if (formtxt === "") {
out.innerText = "请输入城市名称"; 
clearInterval(jisi);
return
};

fetch('https://geocoding-api.open-meteo.com/v1/search?name=' + culitext + '&count=1&language=zh&format=json')
.then((r)=> r.json())
.then((it) => {
if (!it.results) {
out.innerText = "未查询到地区，请输入国家名称或省市、市名称，如“广州”";
clearInterval(jisi);
} else {
dume.innerText = it.results[0].name;
ji = it.results[0].latitude;
wu = it.results[0].longitude;
fetch('https://api.open-meteo.com/v1/forecast?latitude=' + ji + '&longitude=' + wu + '&current=temperature_2m,relative_humidity_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=auto')
.then((r) => r.json())
.then((tianqi) => {
let d = tianqi.current;
let ma = tianqiDaima[d.weather_code] || "未知天气";
fanoc.innerText = Math.round(tianqi.current.temperature_2m) + "°";
xioziqi.innerText = ma + "　湿度 " + d.relative_humidity_2m + "%";
xioziqi2.innerText = "今日最低温度:"+Math.round(tianqi.daily.temperature_2m_min[0])+"º 今日最高温度:"+Math.round(tianqi.daily.temperature_2m_max[0])+"º";

let tian7ma = tianqi.daily;
let gjgp = tian7ma.time.length;
let tian7mamin = tianqi.daily.temperature_2m_min;
let tian7mamax = tianqi.daily.temperature_2m_max;
let tian7matian = tianqi.daily.weather_code;

let fghj = "";
let fghjb = "";
let fghjc = "";
let fghjd = "";

for (let i = 1 ; i < gjgp ; i++) {
let res = tian7ma.time[i].split("-");
let tq = tianqiDaima[tian7matian[i]] || "未知";
fghj = fghj+Number(res[1])+"/"+Number(res[2])+"\n";
fghjb = fghjb+'↓'+Math.round(tian7mamin[i])+'º'+'\n';
fghjc = fghjc+'↑'+Math.round(tian7mamax[i])+ "º"+"\n";
fghjd = fghjd+tq+"\n";
}
tian7.innerText = fghj;
tian7b.innerText = fghjb;
tian7c.innerText = fghjc;
tian7d.innerText = fghjd;
clearInterval(jisi);   
out.innerText = "";
})
.catch(e => out.innerText = "请求失败，请检查您的网络")
}
});}

butt.onclick = function (e) {
e.preventDefault();
txtdian = ".";
culi01();
xioziqi.innerText = "";
xioziqi2.innerText = "";
dume.innerText = "";
fanoc.innerText = "";
tian7.innerText = "";
tian7b.innerText = "";
tian7c.innerText = "";
tian7d.innerText = "";
}

ppsme.onclick = function () {
window.location.href="/" 
}

</script>
  
</body>
</html>
